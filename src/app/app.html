<div class="app-shell">

  <!-- SIDEBAR -->
  <aside class="sidebar" [class.collapsed]="isCollapsed">

    <div class="logo">
      ⚙ מערכת חסד
    </div>

    <button class="toggle-btn" (click)="toggleSidebar()">
      ☰
    </button>

    <nav class="nav">

      @if(volunteerSrv.isVolunteerLoggedIn) {

      <a routerLink="home" routerLinkActive="active-link">
  <span class="material-icons">home</span>
  דף הבית
</a>

<a routerLink="v" routerLinkActive="active-link">
  <span class="material-icons">volunteer_activism</span>
  התנדבות
</a>

<a routerLink="volunteer" routerLinkActive="active-link">
  <span class="material-icons">group</span>
  מתנדבים
</a>

<a routerLink="domain" routerLinkActive="active-link">
  <span class="material-icons">folder</span>
  פרויקטים
</a>

<a routerLink="eichud" routerLinkActive="active-link">
  <span class="material-icons">account_balance</span>
  איחוד
</a>

<a routerLink="position" routerLinkActive="active-link">
  <span class="material-icons">badge</span>
  תפקידים
</a>

<a routerLink="data" routerLinkActive="active-link">
  <span class="material-icons">analytics</span>
  פילוח נתונים
</a>

<a routerLink="login" routerLinkActive="active-link">
  <span class="material-icons">login</span>
  כניסה
</a>

      } @else {

     <a routerLink="data" routerLinkActive="active-link">
  <span class="material-icons">analytics</span>
  פילוח נתונים
</a>

<a routerLink="login" routerLinkActive="active-link">
  <span class="material-icons">login</span>
  כניסה
</a>

      }

    </nav>

  </aside>

  <!-- MAIN -->
  <div class="main">

    <header class="topbar">
      מערכת ניהול מתנדבים
    </header>

    <main class="content">
      <router-outlet></router-outlet>
    </main>

  </div>

</div>
