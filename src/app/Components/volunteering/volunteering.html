<h1>הכנס פרטי התנדבות חדש</h1>
<form [formGroup]="vlntrFrm">

  <label for="dateOfVolunteering">תאריך התנדבות</label>
  <input class="form-control" formControlName="dateOfVolunteering" type="date" name="dateOfVolunteering">

  <label for="volunteerCode">קוד מתנדב</label>
  <select class="form-control" formControlName="volunteerCode" autocomplete="on">
    <option *ngFor="let volun of volunteerService.volunteers; track volun" [value]="volun.volunteerCode">
      {{ volun.volunteerCodeNavigation?.firstName }}
    </option>
  </select>


  <label for="poorManCode">קוד אדם עני</label>

  <select class="form-control" formControlName="poorManCode" autocomplete="on">
    <option *ngFor="let p of ecdService.peopleInTheEichud; track p" [value]="p.eichudCode">
      {{ p.firstName }}
    </option>
  </select>
<!-- {{volunteeringService.matcherCodeInS}} -->

  <label for="matcherCode">קוד מתאם</label>
  <select class="form-control" formControlName="matcherCode" autocomplete="on">

    <option *ngFor="let volun of volunteerService.volunteers; track volun" [value]="volun.volunteerCode">
      {{ volun.volunteerCodeNavigation?.firstName }}
    </option>
  </select>
{{volunteeringService.projectCodeInS}}

<!-- {{volunteeringService.projectCodeInS}} -->
  <select class="form-control" formControlName="projectCode" (change)="onProjectChange($event)">
  <ng-container *ngFor="let pro of projectsArr; track pro">
    <option *ngIf="pro.projectCode !== pro.domainCode" [value]="pro.projectCode" >
      {{ pro.projectName }}
    </option>
  </ng-container>
</select>
<!-- {{volunteeringService.subProjectCodeInS}} -->

  <label for="subProjectCode">קוד תת פרויקט</label>
  <select class="form-control" formControlName="subProjectCode" autocomplete="on" >
    <option *ngFor="let subPro of filteredSubProjects; track subPro" [value]="subPro.projectCode">
      {{ subPro.subProjectName }}
    </option>
  </select>


  <button [disabled]="vlntrFrm.invalid" (click)="addVolunteering()">הוסף</button>

</form>
