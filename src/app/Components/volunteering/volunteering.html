<div class="page">

  <div class="title">הכנס פרטי התנדבות חדש</div>

  <form [formGroup]="vlntrFrm" class="form-card">

    <!-- תאריך התנדבות -->
    <div class="form-group">
      <label>תאריך התנדבות (עברית)</label>
      <div class="date-selects" style="display:flex; gap:8px; align-items:center;">
        <select class="input" formControlName="hebDay" (change)="convertHebToIso()">
          <option [value]="null">יום</option>
          <option *ngFor="let d of hebDayOptions" [value]="d.value">{{d.label}}</option>
        </select>

        <select class="input" formControlName="hebMonth" (change)="convertHebToIso()">
          <option [value]="null">חודש</option>
          <option *ngFor="let m of hebMonths" [value]="m.en">{{m.he}}</option>
        </select>

        <select class="input" formControlName="hebYear" (change)="convertHebToIso()">
          <option [value]="null">שנה</option>
          <option *ngFor="let y of hebYearOptions" [value]="y.value">{{y.label}}</option>
        </select>
      </div>

      <div *ngIf="convertedIso" class="helper">תאריך גרגוריאני: {{convertedIso}}</div>
      <div *ngIf="convertError" class="error">{{convertError}}</div>

      <!-- Hidden ISO field so existing form submission logic remains unchanged -->
      <input type="hidden" formControlName="dateOfVolunteering">
    </div>

    <!-- מתנדב -->
    <div class="form-group">
      <label>קוד מתנדב</label>
      <select class="input" formControlName="volunteerCode">
        <option *ngFor="let volun of volunteerService.volunteers; track volun"
                [value]="volun.volunteerCode">
          {{ volun.volunteerCodeNavigation?.firstName }}
        </option>
      </select>
    </div>

    <!-- אדם עני -->
    <div class="form-group">
      <label>קוד אדם עני</label>
      <select class="input" formControlName="poorManCode">
        <option *ngFor="let p of ecdService.peopleInTheEichud; track p"
                [value]="p.eichudCode">
          {{ p.firstName }}
        </option>
      </select>
    </div>

    <!-- מתאם -->
    <div class="form-group">
      <label>קוד מתאם</label>
      <select class="input" formControlName="matcherCode">
        <option *ngFor="let volun of volunteerService.volunteers; track volun"
                [value]="volun.volunteerCode">
          {{ volun.volunteerCodeNavigation?.firstName }}
        </option>
      </select>
    </div>

    <!-- פרויקט -->
    <div class="form-group">
      <label>פרויקט</label>
      <select class="input"
              formControlName="projectCode"
              (change)="onProjectChange($event)">

        <ng-container *ngFor="let pro of projectsArr; track pro">
          <option *ngIf="pro.projectCode !== pro.domainCode"
                  [value]="pro.projectCode">
            {{ pro.projectName }}
          </option>
        </ng-container>

      </select>
    </div>

    <!-- תת פרויקט -->
    <div class="form-group">
      <label>תת פרויקט</label>
      <select class="input" formControlName="subProjectCode">
        <option *ngFor="let subPro of filteredSubProjects; track subPro"
                [value]="subPro.projectCode">
          {{ subPro.subProjectName }}
        </option>
      </select>
    </div>

    <button class="btn"
            [disabled]="vlntrFrm.invalid"
            (click)="addVolunteering()">
      הוסף
    </button>

  </form>

</div>
